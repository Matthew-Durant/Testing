<!DOCTYPE html>
<html lang="en" data-flow="flow2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancelling your booking</title>
<link rel="stylesheet" href="../assets/lofi.css">
</head>
<body>
<div class="lo-frame" aria-hidden="true">
  <header class="lo-appbar">
    <button class="lo-iconbtn" tabindex="-1" aria-label="Menu"><svg class="lo-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <h1>My booking</h1>
  </header>
</div>

<div class="lo-dialogwrap" role="dialog" aria-modal="true" aria-labelledby="screen-title">
  <div class="lo-dialog">

    <!-- No close control. The commit has already been made and the copy tells
         the participant not to close the window, so offering a way out here
         would contradict it. Deliberate divergence, recorded in BUILD-RECORD. -->
    <div class="lo-dialog-head">
      <span class="lo-dialog-label">Cancel your booking</span>
    </div>

    <div class="lo-dialog-body is-centred" role="status" aria-live="polite">
      <div class="lo-spinner"></div>
      <h1 class="lo-t-md" id="screen-title" data-screen-heading>Cancelling your booking</h1>
      <p class="lo-t-sm">Do not close this window. This takes a few seconds.</p>
    </div>

  </div>
</div>

<script src="../assets/lofi.js"></script>
<script src="../assets/mmb.js"></script>
<script>
setTimeout(function () {
  window.location.href = '06-cancelled.html';
}, 1600);
</script>
</body>
</html>
